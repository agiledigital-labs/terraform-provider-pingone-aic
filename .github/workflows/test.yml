name: test

on:
  # Work lands on main directly in these early stages, so gate every branch
  # push rather than relying on a pull_request check that may never run.
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Use the repo's pinned toolchain rather than resolving Go separately,
      # so CI and `nix develop` cannot drift. `.#ci` is the lean shell — no
      # terraform, which is unfree and would build from source here.
      - uses: cachix/install-nix-action@v31.11.1

      - name: gofmt
        run: |
          unformatted=$(nix develop .#ci --command gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "needs gofmt:"
            echo "$unformatted" | sed 's/^/  /'
            exit 1
          fi

      # A directly imported module left marked `// indirect` passes vet, test,
      # lint and build. Only tidy notices.
      - name: go mod tidy
        run: |
          nix develop .#ci --command go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy — commit the result of 'make tidy':"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: nix develop .#ci --command go vet ./...

      - name: go test
        run: nix develop .#ci --command go test ./...

      # Enabled set and the reasoning behind it live in .golangci.yml.
      - name: golangci-lint
        run: nix develop .#ci --command golangci-lint run ./...

      - name: build provider
        run: nix develop .#ci --command go build -o /tmp/terraform-provider-pingone-aic .

      - name: build generate CLI
        run: nix develop .#ci --command go build -o /tmp/pingoneaic-tf ./cmd/generate
